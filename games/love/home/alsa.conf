# Partycade: ALSA for Home's programs and the classics (homeloop sets ALSA_CONFIG_PATH): the stock config, then
# "default" through dmix, so Home's hold ticks can sound over a running game.
</usr/share/alsa/alsa.conf>
pcm.!default {
  type plug
  slave.pcm "partycade_mix"
}
pcm.partycade_mix {
  type dmix
  ipc_key 4242
  ipc_perm 0666
  slave {
    pcm "hw:0,0"
    rate 44100
    period_size 512
    buffer_size 4096
  }
}
ctl.!default {
  type hw
  card 0
}
